[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formatscout"
version = "0.1.0"
description = "Multi-tier disk image and directory format/platform/era detector (hash, magic-byte, structural, directory heuristics, extension fallback), including Xbox xISO/DVD-rip identification as one of its ISO-tier signals."
readme = "README.md"
# formatscout/magic/magic_detect.py reads magic_signatures.toml via the
# stdlib tomllib module, added in Python 3.11 (not 3.10, tomllib does not
# exist there). Every import across formatscout/ (excluding tests/)
# is either stdlib (hashlib, json, re, struct, sys, zlib, dataclasses,
# difflib, pathlib, typing, logging, xml.etree.ElementTree, argparse) or a
# same-package relative import, confirmed by grepping every `^import `/
# `^from ` line in the package. No third-party runtime dependency exists.
requires-python = ">=3.11"
dependencies = []

# tests/ imports the package by its own name throughout (`from
# formatscout.tests import smart_media_fixtures as fx`, plus per-test local
# imports of the modules under test). No pre-extraction monorepo import paths
# remain anywhere under the package. pytest is the only test-time dependency
# and is deliberately not declared here, there is no optional-dependency
# group yet.
#
# formatscout.tests is intentionally absent from the packages list below:
# the suite ships in the repository but is not installed with the
# distribution. Run it from a source checkout (`pytest formatscout/tests/`).

[tool.setuptools]
packages = [
    "formatscout",
    "formatscout.hashing",
    "formatscout.magic",
    "formatscout.utils",
    "formatscout.validators",
]

[tool.setuptools.package-data]
"formatscout.hashing" = ["hash_index.json"]
"formatscout.magic" = ["magic_signatures.toml"]
