[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formatscout"
version = "0.1.0"
description = "Multi-tier disk image and directory format/platform/era detector (hash, magic-byte, structural, directory heuristics, extension fallback), including Xbox xISO/DVD-rip identification as one of its ISO-tier signals."
readme = "README.md"
# smart_media_detector/magic/magic_detect.py reads magic_signatures.toml via the
# stdlib tomllib module, added in Python 3.11 (not 3.10, tomllib does not
# exist there). Every import across smart_media_detector/ (excluding tests/)
# is either stdlib (hashlib, json, re, struct, sys, zlib, dataclasses,
# difflib, pathlib, typing, logging, xml.etree.ElementTree, argparse) or a
# same-package relative import, confirmed by grepping every `^import `/
# `^from ` line in the package. No third-party runtime dependency exists.
requires-python = ">=3.11"
dependencies = []

# tests/ under smart_media_detector/ still imports itself via the absolute
# monorepo path (`from backend.service.utils.smart_media_detector.tests import
# smart_media_fixtures`, 11 files, plus one `import
# backend.service.utils.smart_media_detector.magic.magic_detect` in
# test_magic_detect.py) left over from its origin inside peach_1up. This was
# not in scope to fix during this extraction pass (copy-only, no import
# repointing) and the test suite will not currently import successfully from
# this package's own root. Flagged for a follow-up pass, not fixed here.
# test_iso_detect.py additionally monkeypatches an iso_detect.is_xiso name
# that no longer exists as of the xbox_image-into-ScanResult rewrite; those
# specific assertions need updating for the new detect_xbox_image_type-based
# dispatch and requires_extraction field, on top of the import fix above.

[tool.setuptools]
packages = [
    "smart_media_detector",
    "smart_media_detector.hashing",
    "smart_media_detector.magic",
    "smart_media_detector.utils",
    "smart_media_detector.validators",
]

[tool.setuptools.package-data]
"smart_media_detector.hashing" = ["hash_index.json"]
"smart_media_detector.magic" = ["magic_signatures.toml"]
